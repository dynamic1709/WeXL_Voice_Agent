<div class="login-wrapper">
    <div class="glass-card login-card">
        <div class="header-section">
            <h2 class="title">Welcome Back</h2>
            <p class="subtitle">Login to access your dashboard</p>
        </div>
        
        <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
            
            <div class="modern-form-group">
                <label for="email">Email Address</label>
                <input type="email" formControlName="email" class="modern-input" [ngClass]="{ 'is-invalid': submitted && f['email'].errors }" id="email" placeholder="name@example.com">
                <div *ngIf="submitted && f['email'].errors" class="modern-error-text">
                    <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
                    <span *ngIf="f['email'].errors['required']">Email is required</span>
                    <span *ngIf="f['email'].errors['email']">Enter a valid email address</span>
                </div>
            </div>

            <div class="modern-form-group">
                <label for="password">Password</label>
                <input type="password" formControlName="password" class="modern-input" [ngClass]="{ 'is-invalid': submitted && f['password'].errors }" id="password" placeholder="••••••••">
                <div *ngIf="submitted && f['password'].errors" class="modern-error-text">
                    <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
                    <span *ngIf="f['password'].errors['required']">Password is required</span>
                </div>
            </div>

            <div *ngIf="errorMessage" class="modern-alert alert-danger">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="15" y1="9" x2="9" y2="15"></line><line x1="9" y1="9" x2="15" y2="15"></line></svg>
                {{ errorMessage }}
            </div>

            <button [disabled]="loading" class="btn-modern" type="submit" style="margin-top: 1.5rem;">
                <div *ngIf="loading" class="spinner-loader"></div>
                <span *ngIf="!loading">Sign In</span>
                <span *ngIf="loading">Signing In...</span>
            </button>

            <div class="form-footer">
                <p>Don't have an account? <a routerLink="/register">Create one</a></p>
            </div>
        </form>
    </div>
</div>
